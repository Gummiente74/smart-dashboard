
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Smart Info Dashboard</title>
    <style>
        body {
            background-color: black;
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            text-align: center;
        }
        .clock {
            font-size: 80px;
            margin-top: 20px;
        }
        .weather {
            font-size: 24px;
            margin-bottom: 20px;
        }
        iframe {
            border: none;
        }
    </style>
</head>
<body>
    <div class="clock" id="clock">00:00</div>
    <div class="weather" id="weather">
        Kamen: 17°C, sonnig  Dortmund: 18°C, leicht bewölkt
    </div>

    <iframe 
      src="https://calendar.google.com/calendar/embed?src=466js1j2sl41h1fb35dt6m9k9mb8bmln%40import.calendar.google.com&mode=DAY&ctz=Europe%2FBerlin" 
      style="width: 100%; height: 600px;">
    </iframe>

    <script>
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('clock').textContent = `${hours}:${minutes}`;
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
