
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Smart Info Dashboard</title>
    <style>
        body {
            margin: 0;
            background-color: black;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        .clock {
            font-size: 5em;
            margin-top: 20px;
        }
        .weather {
            font-size: 1.5em;
            margin-top: 10px;
            margin-bottom: 20px;
        }
        iframe {
            border: 0;
        }
    </style>
</head>
<body>
    <div class="clock" id="clock">--:--</div>
    <div class="weather">
        Kamen: 17°C, sonnig  Dortmund: 18°C, leicht bewölkt
    </div>
    <iframe src="https://calendar.google.com/calendar/embed?src=466js1j2sl41h1fb35dt6m9k9mb8bmln%40import.calendar.google.com&mode=day"
            style="border: 0" width="800" height="600" frameborder="0" scrolling="no"></iframe>
    <script>
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('clock').textContent = `${hours}:${minutes}`;
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
